appId: io.github.polyrainbow.neno
productName: NENO
copyright: Copyright © NENO contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json
  # Everything the app needs at runtime is bundled by Vite into dist/ and
  # dist-electron/; the main and preload bundles require only "electron"
  # and node builtins.
  - "!node_modules/**"

# Ad-hoc signs the packed app before it goes into the .dmg. Not
# optional: without it macOS calls the downloaded app damaged. See the
# hook for why electron-builder's own signing options cannot do this.
afterPack: tools/afterPack.mjs

mac:
  target: dmg
  category: public.app-category.productivity
  icon: build/icon.png

dmg:
  artifactName: NENO-${version}.dmg
