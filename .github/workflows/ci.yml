name: CI

# Every check that gates a change: linting, unit tests, the Playwright
# integration suite and a real electron-builder packaging run. The
# release workflow calls this same file with workflow_call, so a tagged
# build is verified by exactly the checks a pull request gets, and it
# publishes the .dmg this workflow produced.
#
# The web and desktop jobs run on macOS because that is the only
# desktop platform the app ships on: the .dmg can only be built there,
# and the Node fs storage provider has APFS-specific behaviour (NFC
# normalization) that its unit tests cover. The Android job runs on
# Linux, which is all Gradle and the JVM tests need.
#
# The visual regression suite is deliberately not here — its snapshots
# are pixel comparisons taken on a developer machine, which a runner's
# font and GPU stack will not reproduce. Run `npm run
# visual-regression-test` locally instead.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

# Pull request runs are grouped by PR number, not by ref: a run that
# starts after its PR is merged sees github.ref fall back to
# refs/heads/main, and would otherwise cancel main's push run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, unit tests and type check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
    - name: Stylelint
      run: npm run stylelint
    - name: ESLint (src, electron, tests)
      run: npm run lint
    - name: Unit and i18n tests
      run: npm run test
    - name: TypeScript check and renderer build
      run: npm run build

  integration-tests:
    name: Integration tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
    # Only the chromium project is configured in playwright.config.ts.
    - name: Install Playwright browser
      run: npx playwright install chromium
    - name: Run Playwright tests
      run: npm run integration-test
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  package:
    name: Package macOS app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # The build is unsigned; do not let electron-builder look for an
      # identity in the runner's keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
    # Builds the renderer and the main/preload bundles, renders
    # build/icon.png with Electron's Chromium and produces
    # release/NENO-<version>.dmg.
    #
    # The script passes --publish never, and must keep doing so:
    # electron-builder otherwise starts publishing on its own as soon as
    # it detects a CI tag build, and then fails the job asking for a
    # GH_TOKEN it has no reason to need. Publishing is the separate
    # `publish` job's work, from the artifact uploaded below. That
    # difference only shows up on a tag, so a green pull request says
    # nothing about it.
    - name: Build macOS app
      run: npm run electron:build
    - name: Upload .dmg
      uses: actions/upload-artifact@v7
      with:
        name: neno-dmg
        path: release/*.dmg
        if-no-files-found: error
        retention-days: 7

  android:
    name: Android tests and APK
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    # A tag build signs the APK with the release key. It must be the key
    # the installed app was signed with: Android refuses an update signed
    # with any other, and the uninstall it asks for deletes the graph.
    # The secrets reach this file because release.yml passes them on
    # (`secrets: inherit`); pull requests never get them, and build an
    # unsigned APK only to prove that it builds.
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - uses: android-actions/setup-android@v4
    - run: npm ci
    - name: Install the signing key
      if: env.IS_TAG == 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] \
          || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
          echo "The ANDROID_* signing secrets are not all set." >&2
          exit 1
        fi
        KEYSTORE="$RUNNER_TEMP/neno-release.jks"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
        {
          printf 'storeFile=%s\n' "$KEYSTORE"
          printf 'storePassword=%s\n' "$STORE_PASSWORD"
          printf 'keyAlias=%s\n' "$KEY_ALIAS"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD"
        } > android/keystore.properties
    # Builds the web app, copies it into android/ and produces the
    # release APK (app-release.apk when signed, app-release-unsigned.apk
    # when not) and the AAB.
    - name: Build APK
      run: npm run android:release
    # After the build: Gradle cannot even configure the project before
    # `cap sync` (part of android:release) has generated the gitignored
    # capacitor-cordova-android-plugins/. GitSyncTest and GitRepoTest
    # drive the other machine through the system git, which the runner
    # has at /usr/bin/git.
    - name: Kotlin unit tests
      run: npm run android:test
    - name: Name the signed APK after the version
      if: env.IS_TAG == 'true'
      run: |
        VERSION="$(node -p "require('./package.json').version")"
        APK=android/app/build/outputs/apk/release/app-release.apk
        APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)"
        "$APKSIGNER" verify --print-certs "$APK"
        mkdir -p release
        cp "$APK" "release/NENO-$VERSION.apk"
    - name: Upload APK
      if: env.IS_TAG == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: neno-apk
        path: release/*.apk
        if-no-files-found: error
        retention-days: 7
    - name: Remove the signing key
      if: always() && env.IS_TAG == 'true'
      run: rm -f android/keystore.properties "$RUNNER_TEMP/neno-release.jks"
