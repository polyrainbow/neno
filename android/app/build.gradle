apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

/*
  The version follows package.json, like the desktop app's: 11.4.0
  becomes versionName "11.4.0" and versionCode 110400.
*/
def packageJson = new groovy.json.JsonSlurper()
  .parse(rootProject.file("../package.json"))
def (major, minor, patch) = packageJson.version.tokenize(".")*.toInteger()

/*
  Builds are signed with the key described in android/keystore.properties
  (storeFile, storePassword, keyAlias, keyPassword), which is never
  committed. Without it, debug builds use the SDK's debug key and
  assembleRelease produces an unsigned APK.
*/
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "io.github.polyrainbow.neno"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.polyrainbow.neno"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 10000 + minor * 100 + patch
        versionName packageJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*',
                'META-INF/NOTICE*', 'META-INF/*.SF', 'META-INF/*.DSA',
                'META-INF/*.RSA', 'plugin.properties', 'about.html',
                'OSGI-INF/l10n/plugin.properties']
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        /*
          Debug builds are signed with the release key too, when there is
          one: Android refuses to install a build signed with a different
          key over an installed app, and the uninstall it asks for deletes
          the graph — a clone that may take minutes to make again.
        */
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    /*
      JGit 7 needs the Java 11 APIs that Android only has from 13 on
      (InputStream.readNBytes, in its pack protocol), hence minSdk 33.
      JGit 5.13 would reach older Androids, but pins an Apache MINA SSHD
      from before the Terrapin fix (CVE-2023-48795).
    */
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.8.1.202611041320-r'
    implementation('org.eclipse.jgit:org.eclipse.jgit.ssh.apache:7.8.1.202611041320-r')
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
